<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="500" viewBox="0 0 1200 500" role="img" aria-labelledby="title desc">
  <title id="title">Flood crisis situation awareness and decision support</title>
  <desc id="desc">A four-step flow connects observations and inspections, forecasting and risk assessment, shared situational awareness, and coordinated crisis decisions.</desc>
  <rect width="1200" height="500" rx="28" fill="#F8FAFC"/>
  <text x="600" y="58" text-anchor="middle" font-family="Arial, sans-serif" font-size="32" font-weight="700" fill="#1F2A37">Flood Crisis Situation Awareness</text>
  <g font-family="Arial, sans-serif">
    <rect x="40" y="135" width="245" height="220" rx="22" fill="#EAF2FB" stroke="#0F4D9D" stroke-width="3"/>
    <text x="162.5" y="185" text-anchor="middle" font-size="22" font-weight="700" fill="#0F4D9D">OBSERVE</text>
    <text x="162.5" y="225" text-anchor="middle" font-size="17" fill="#1F2A37">Water levels</text>
    <text x="162.5" y="255" text-anchor="middle" font-size="17" fill="#1F2A37">Field reports</text>
    <text x="162.5" y="285" text-anchor="middle" font-size="17" fill="#1F2A37">Dike / levee inspections</text>
    <text x="162.5" y="315" text-anchor="middle" font-size="17" fill="#1F2A37">Changing conditions</text>

    <path d="M300 245 H345" stroke="#64748B" stroke-width="5" stroke-linecap="round"/>
    <path d="M335 231 L355 245 L335 259" fill="none" stroke="#64748B" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"/>

    <rect x="365" y="135" width="245" height="220" rx="22" fill="#E9F6EA" stroke="#4C9C53" stroke-width="3"/>
    <text x="487.5" y="185" text-anchor="middle" font-size="22" font-weight="700" fill="#3C7E43">ASSESS &amp; FORECAST</text>
    <text x="487.5" y="225" text-anchor="middle" font-size="17" fill="#1F2A37">Flood risk &amp; resilience</text>
    <text x="487.5" y="255" text-anchor="middle" font-size="17" fill="#1F2A37">Flood-wave propagation</text>
    <text x="487.5" y="285" text-anchor="middle" font-size="17" fill="#1F2A37">Inundation forecasting</text>
    <text x="487.5" y="315" text-anchor="middle" font-size="17" fill="#1F2A37">AI-based approaches</text>

    <path d="M625 245 H670" stroke="#64748B" stroke-width="5" stroke-linecap="round"/>
    <path d="M660 231 L680 245 L660 259" fill="none" stroke="#64748B" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"/>

    <rect x="690" y="135" width="215" height="220" rx="22" fill="#EAF2FB" stroke="#0F4D9D" stroke-width="3"/>
    <text x="797.5" y="185" text-anchor="middle" font-size="21" font-weight="700" fill="#0F4D9D">BUILD A SHARED</text>
    <text x="797.5" y="214" text-anchor="middle" font-size="21" font-weight="700" fill="#0F4D9D">SITUATION PICTURE</text>
    <text x="797.5" y="260" text-anchor="middle" font-size="17" fill="#1F2A37">What is happening?</text>
    <text x="797.5" y="290" text-anchor="middle" font-size="17" fill="#1F2A37">What may happen next?</text>
    <text x="797.5" y="320" text-anchor="middle" font-size="17" fill="#1F2A37">What could be affected?</text>

    <path d="M920 245 H965" stroke="#64748B" stroke-width="5" stroke-linecap="round"/>
    <path d="M955 231 L975 245 L955 259" fill="none" stroke="#64748B" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"/>

    <rect x="985" y="135" width="175" height="220" rx="22" fill="#E9F6EA" stroke="#4C9C53" stroke-width="3"/>
    <text x="1072.5" y="185" text-anchor="middle" font-size="22" font-weight="700" fill="#3C7E43">DECIDE</text>
    <text x="1072.5" y="225" text-anchor="middle" font-size="17" fill="#1F2A37">Coordinate</text>
    <text x="1072.5" y="255" text-anchor="middle" font-size="17" fill="#1F2A37">Communicate</text>
    <text x="1072.5" y="285" text-anchor="middle" font-size="17" fill="#1F2A37">Prioritise actions</text>
    <text x="1072.5" y="315" text-anchor="middle" font-size="17" fill="#1F2A37">Review &amp; adapt</text>

    <text x="600" y="425" text-anchor="middle" font-size="18" fill="#475569">Prototype learning diagram · Flood Crisis Management in Estuarine Areas</text>
  </g>
</svg>
